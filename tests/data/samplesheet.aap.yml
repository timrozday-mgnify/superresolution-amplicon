# bin/aap_samplesheet.py tests/data/aap --panel tests/data/refs.fasta, with the paths made
# repo-relative (tests/test_aap_samplesheet.py keeps the two in step). Needs --trim_primers false.
- id: run_a
  reads: tests/data/aap/run_a/qc/run_a.merged.fastq.gz
