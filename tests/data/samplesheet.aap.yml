  merge_rate: 0.95
  mseq: tests/data/aap/run_a/taxonomy-summary/SILVA-SSU/run_a.mseq
  panel_references: tests/data/refs.fasta
- id: run_b
  reads: tests/data/aap/run_b/qc/run_b.merged.fastq.gz
  merged: true
  merge_rate: 0.7
  panel_references: tests/data/refs.fasta
