name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  nf-test-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Pinned, like nf-test below: unpinned, this took whatever Nextflow had released
      # that hour. 26.10.0 sends a workflow `error` to stderr where 26.04 sent it to
      # stdout, so every test asserting a refusal's message on `workflow.stdout` failed
      # -- 10 of them, on a main commit that had passed two hours earlier. 26.04 is also
      # what this pipeline is run with: hpc/sramp-panel's configs work around its
      # pre-26.04 `-c` param handling.
      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.7"
      # 0.9.4+: 0.9.3 wraps a process test as `PROC(*input)`, which current Nextflow's
      # strict parser refuses.
      - uses: nf-core/setup-nf-test@v1
        with:
          version: 0.9.4
      - name: nf-test (stub)
        run: nf-test test --tag stub
