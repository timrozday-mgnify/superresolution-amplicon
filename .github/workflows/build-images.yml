name: Build container images

# Builds and pushes two images to GHCR, both published publicly so HPC pulls need no
# authentication:
# - sra-skiver: the vendored skiver submodule + its Python env, for error-model training,
#   read simulation and the alignment kernel. amd64 only: the skiver Rust/htslib build
#   does not cross-compile to arm64 and segfaults cc1 under QEMU.
# - sramp-python: the Python env for every other step. No Rust build, so it is built for
#   arm64 too, and Apple-silicon laptops run it natively instead of emulating x86.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/skiver/Dockerfile
          push: true
          # Single-platform, no attestations: buildx's default provenance/SBOM
          # attestations make the pushed ref an OCI index with an unknown/unknown
          # manifest that Singularity/Apptainer can't convert to SIF. Keep it a
          # plain single-image manifest.
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/timrozday-mgnify/sra-skiver:latest
            ghcr.io/timrozday-mgnify/sra-skiver:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 under QEMU: everything is a wheel except edlib, one small C++ file.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/python/Dockerfile
          push: true
          # A two-platform index, still without attestations: their unknown/unknown
          # entries are what Singularity/Apptainer cannot convert (see build above).
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/timrozday-mgnify/sramp-python:latest
            ghcr.io/timrozday-mgnify/sramp-python:${{ github.sha }}
          cache-from: type=gha,scope=sramp-python
          cache-to: type=gha,mode=max,scope=sramp-python
