name: Build container image

# Builds the self-contained sra-skiver image from the vendored skiver submodule and
# pushes it to GHCR. Built on an amd64 runner (native — the skiver Rust/htslib build
# does not cross-compile to arm64 and segfaults cc1 under QEMU). The package is
# published publicly so HPC pulls need no authentication.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/skiver/Dockerfile
          push: true
          # Single-platform, no attestations: buildx's default provenance/SBOM
          # attestations make the pushed ref an OCI index with an unknown/unknown
          # manifest that Singularity/Apptainer can't convert to SIF. Keep it a
          # plain single-image manifest.
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/timrozday-mgnify/sra-skiver:latest
            ghcr.io/timrozday-mgnify/sra-skiver:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
